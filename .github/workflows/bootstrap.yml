name: Bootstrap Context English V0.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Expand corrected source package
        run: unzip -o context-english-v0.1-source-r4.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Context-English-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Context-English-v0.1-debug-apk
          path: output/Context-English-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --ignore-unmatch context-english-v0.1-source.zip context-english-v0.1-source-r2.zip context-english-v0.1-source-r3.zip context-english-v0.1-source-r4.zip .github/workflows/bootstrap.yml
          git commit -m "Build Context English Android V0.1"
          git push
