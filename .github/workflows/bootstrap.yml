name: Bootstrap Context English V0.1


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: write


jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5


      - name: Expand corrected source package
        run: unzip -o context-english-v0.1-source-r4.zip -d .


      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"


      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
