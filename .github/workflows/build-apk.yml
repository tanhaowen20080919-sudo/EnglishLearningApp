name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: Build a permanently signed Release (requires the four Release Secrets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build validation APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify retained vocabulary and database migrations
        run: |
          python3 tools/verify_vocabulary.py
          python3 tools/verify_learning_resources.py
          python3 tools/verify_acceptance_coverage.py
          python3 tools/verify_migration.py
          python3 -m unittest discover -s tools/tests -v
      - name: Test, lint and build explicitly unsigned Release for validation
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease -PunsignedRelease=true --stacktrace
      - name: Upload validation builds (not permanent-signed releases)
        uses: actions/upload-artifact@v4
        with:
          name: validation-apks-not-for-release
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Build with the permanent v1.0+ Release certificate
    needs: [validate, ui-smoke]
    if: (github.event_name == 'workflow_dispatch' && inputs.build_release) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Restore the existing permanent key and verify its pinned certificate
        id: signing_key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: python3 tools/prepare_release_signing.py --output "$RUNNER_TEMP/englishlearning-permanent-release.jks" --github-env
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build the permanently signed Release (no debug-signing fallback)
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.configuration-cache=false :app:assembleRelease --stacktrace
      - name: Verify and package the permanent-signed APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/EnglishLearning-release.apk
          python3 tools/verify_release_apk.py release-output/EnglishLearning-release.apk --output release-output/RELEASE.json
          cp config/release-certificate.pem release-output/
          cd release-output
          sha256sum EnglishLearning-release.apk > SHA256SUMS
      - name: Remove only this job's restored temporary key
        if: ${{ always() && steps.signing_key.outcome == 'success' }}
        run: rm -f "$RUNNER_TEMP/englishlearning-permanent-release.jks"
      - name: Upload permanently signed Release and public verification data
        uses: actions/upload-artifact@v4
        with:
          name: EnglishLearning-permanent-signed-Release
          path: release-output/
          if-no-files-found: error
          retention-days: 30

  ui-smoke:
    name: Check Android navigation and backup restore
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline UI and backup smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace; test_status=$?; adb pull /sdcard/Download/englishlearning-ui-evidence app/build/screenshots || exit 1; if [ "$test_status" -eq 0 ]; then test -s app/build/screenshots/ui-responsiveness.json || exit 1; fi; exit "$test_status"
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 30
