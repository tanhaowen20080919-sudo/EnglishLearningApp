name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore fixed debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          value = os.environ.get("ANDROID_DEBUG_KEYSTORE_BASE64", "")
          if value:
              target = Path.home() / ".android" / "debug.keystore"
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(value, validate=True))
              target.chmod(0o600)
          PYCODE

      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify local data migrations and unchanged vocabulary
        run: |
          python tools/verify_migration.py
          python tools/verify_vocabulary.py

      - name: Test, lint and build APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Context-English-v0.4.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Context-English-v0.4.0-debug-apk
          path: output/Context-English-v0.4.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

  ui-smoke:
    name: Check Android navigation and backup restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore fixed debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          value = os.environ.get("ANDROID_DEBUG_KEYSTORE_BASE64", "")
          if value:
              target = Path.home() / ".android" / "debug.keystore"
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(value, validate=True))
              target.chmod(0o600)
          PYCODE

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline UI and backup smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.tanhaowen.contextenglish/files/screenshots app/build/screenshots || true
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 30
